<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم الذكي v3.1</title>
    <style>
        :root { --primary: #d35400; --secondary: #27ae60; --bg: #f4f7f6; --accent: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-top: 130px; padding-bottom: 120px; scroll-behavior: smooth; }
        
        /* الهيدر والأقسام */
        .fixed-header { position: fixed; top: 0; left: 0; right: 0; background: white; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        .nav-tabs { display: flex; overflow-x: auto; white-space: nowrap; padding: 15px 10px; gap: 10px; scrollbar-width: none; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab { background: #f0f0f0; padding: 8px 18px; border-radius: 20px; text-decoration: none; color: #555; font-weight: bold; font-size: 0.85rem; border: 1px solid #ddd; }
        
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        /* أزرار الخدمات */
        .service-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .call-btn { flex: 2; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .share-btn { flex: 1; background: #3498db; color: white; border: none; padding: 12px; border-radius: 15px; font-weight: bold; cursor: pointer; }

        .category-section { scroll-margin-top: 140px; margin-bottom: 40px; }
        .category-title { background: #34495e; color: white; padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; }
        
        .menu-item { background: white; display: flex; align-items: center; padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.03); border: 1px solid #eee; }
        .item-image { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; margin-left: 15px; }
        .item-info { flex-grow: 1; }
        .prep-time { font-size: 0.8rem; color: #7f8c8d; display: block; margin-top: 4px; }
        .price { color: var(--secondary); font-weight: bold; font-size: 1.1rem; margin-top: 5px; display: block; }
        
        .add-btn { background: var(--primary); color: white; border: none; border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: bold; }

        /* السوشيال ميديا */
        .social-footer { text-align: center; padding: 30px 10px; background: #fff; border-radius: 25px 25px 0 0; }
        .social-icons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .social-icons a { text-decoration: none; font-size: 0.8rem; padding: 10px; border-radius: 10px; color: white; font-weight: bold; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-radius: 25px 25px 0 0; }
        .order-btn { background: var(--secondary); color: white; border: none; padding: 15px 30px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="fixed-header">
    <div class="nav-tabs">
        <a href="#eastern" class="tab">🥘 أطباق شرقية</a>
        <a href="#western" class="tab">🍔 أطباق غربية</a>
        <a href="#drinks" class="tab">🍹 المشروبات</a>
    </div>
</div>

<div class="container">
    <div style="text-align:center; margin-bottom:15px;">
        <span id="tableLabel" style="background:#eee; padding:5px 15px; border-radius:20px; font-weight:bold;">طاولة: ..</span>
    </div>

    <div class="service-buttons">
        <button class="call-btn" onclick="callWaiter()">🔔 نداء النادل</button>
        <button class="share-btn" onclick="shareMenu()">🔗 مشاركة</button>
    </div>

    <section id="eastern" class="category-section">
        <div class="category-title">🥘 الأكلات الشرقية</div>
        <div class="menu-item">
            <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=200" class="item-image">
            <div class="item-info">
                <b>قوزي عراقي</b>
                <span class="prep-time">⏱️ تحضير: 15 دقيقة</span>
                <span class="price">25,000 د.ع</span>
            </div>
            <button class="add-btn" onclick="addToCart('قوزي عراقي', 25000)">+</button>
        </div>
    </section>

    <div class="social-footer">
        <b>تابعونا لتصلكم عروضنا</b>
        <div class="social-icons">
            <a href="#" style="background:#e1306c;">انستغرام</a>
            <a href="#" style="background:#000;">تيك توك</a>
            <a href="#" style="background:#1877f2;">فيسبوك</a>
        </div>
    </div>
</div>

<div class="cart-bar">
    <div>إجمالي: <b id="totalPrice">0</b> د.ع</div>
    <button class="order-btn" onclick="sendToWhatsApp()">إرسال الطلب ✅</button>
</div>

<script>
    const restaurantPhone = "9647725801894"; 
    const params = new URLSearchParams(window.location.search);
    const tableNo = params.get('table') || "غير محددة";
    document.getElementById('tableLabel').innerText = "4: " + tableNo;

    let cart = [];
    let total = 0;

    function addToCart(name, price) {
        cart.push({name, price});
        total += price;
        document.getElementById('totalPrice').innerText = total.toLocaleString();
    }

    function callWaiter() {
        window.open(`https://wa.me/${restaurantPhone}?text=🔔 نداء مساعدة من طاولة: ${tableNo}`);
    }

    function shareMenu() {
        // مشاركة الرابط الأساسي فقط بدون رقم الطاولة
        const baseUrl = window.location.href.split('?')[0];
        if (navigator.share) {
            navigator.share({ title: 'منيو المطعم', url: baseUrl });
        } else {
            alert("رابط المنيو: " + baseUrl);
        }
    }

    function sendToWhatsApp() {
        if(cart.length === 0) return alert("السلة فارغة");
        const orderID = Math.floor(1000 + Math.random() * 9000);
        let itemsList = cart.map(i => "- " + i.name).join('%0A');
        let message = `📝 طلب جديد #${orderID}%0A📍 طاولة: ${tableNo}%0A%0الطلبات:%0A${itemsList}%0A%0A💰 الإجمالي: ${total.toLocaleString()} د.ع`;
        window.open(`https://wa.me/${restaurantPhone}?text=${message}`);
    }
</script>

</body>
</html>
